#
# Default Bacula Storage Daemon Configuration file
#
#  For Bacula 15.x on EL10 (EPEL)
#
# You may need to change the name of your tape drive
#   on the "Archive Device" directive in the Device
#   resource.  If you change the Name and/or the
#   "Media Type" in the Device resource, please ensure
#   that dird.conf has corresponding changes.
#

Storage {                             # definition of myself
  Name = bacula-sd
  SDPort = 9103                  # Director's port
  WorkingDirectory = "/var/spool/bacula"
  Pid Directory = "/var/run"
  Maximum Concurrent Jobs = 20
}


#
# Note, for a list of additional Device templates please
#  see the directory <bacula-source>/examples/devices
# Or follow the following link:
#  http://bacula.svn.sourceforge.net/viewvc/bacula/trunk/bacula/examples/devices/
#

#
# Devices supported by this Storage daemon
# To connect, the Director's bacula-dir.conf must have the
#  same Name and MediaType.
#

# Alternatively, name storage daemons
# FileStorage-1, FileStorage-2 etc
# Each can reside in a different path, e.g. /home/bacula-1, /home/bacula-2
#

# File storage devices (FileStorage-1, FileStorage-2, ...) are generated for
# every configured slot by the bacula-sd.sh include below, based on the slot
# directories under local.d/servers.

Device {
  Name = NULL
  Media Type = NULL
  Device Type = Fifo
  Archive Device = /dev/null
  LabelMedia = yes
  Random Access = no
  AutomaticMount = no
  RemovableMedia = no
  MaximumOpenWait = 60
  AlwaysOpen = no
}

#
# Send all messages to the Director,
# mount messages also are sent to the email address
#
Messages {
  Name = Standard
  director = bacula-dir = all
}

@|/etc/bacula/conf.d/bacula-sd.sh
# Add custom directives here
@/etc/bacula/local.d/bacula-sd-custom.conf
