# Database configuration
# This file is included as part of include.sh

Catalog {
  Name = MyCatalog
# Use the native driver name (mysql, postgresql, sqlite3). The DBI prefix
# ("dbi:mysql") only works when Bacula is compiled with DBI support, which
# the EL10/EPEL builds are not. DB_DRIVER is written by the apnscp-bacula addin.
  dbdriver = "${DB_DRIVER}"; dbaddress = ${DB_HOSTNAME}; dbname = "${DB_NAME}"; dbuser = "${DB_USER}"; dbpassword = "${DB_PASSWORD}"
}
