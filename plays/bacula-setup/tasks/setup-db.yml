---
- set_fact:
    db_bin: "{{ (bacula_driver == 'mysql') | ternary('mysql', 'psql') }}"
  when: bacula_driver in ['mysql','postgresql']
- set_fact:
    db_check_query: >
      SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME = '{{ bacula_credentials.db_name | regex_replace("'", "\\'") }}'
  when: bacula_driver == 'mysql'
- set_fact:
    db_check_query: >
      SELECT datname FROM pg_catalog.pg_database WHERE lower(datname) = lower('{{ bacula_credentials.db_name | regex_replace("'", "\\'") }}');
  when: bacula_driver == 'postgresql'
# Keep this a single task: a skipped task still overwrites its register, so
# splitting MySQL/PostgreSQL into two `register: r` tasks would leave `r`
# without a `stdout` attribute for whichever driver ran first.
- name: Verify database exists
  shell: >-
      echo {{ db_check_query | quote }} | {{ db_bin }} {{ (bacula_driver == 'mysql') | ternary('mysql','template1') }}
  register: r
  changed_when: false
  become: "{{ bacula_driver == 'postgresql' }}"
  become_user: postgres

- name: Create Bacula database {{ bacula_credentials.db_name }}
  mysql_db:
    name: "{{ bacula_credentials.db_name }}"
  when:
    - bacula_driver == 'mysql'
    - r.stdout.find(bacula_credentials.db_name) == -1
- name: Create Bacula database {{ bacula_credentials.db_name }}
  command: "/usr/libexec/bacula/create_{{ bacula_driver }}_database"
  environment:
    db_name: "{{ bacula_credentials.db_name }}"
  become: "{{ bacula_driver == 'postgresql' }}"
  become_user: postgres
  when:
    - bacula_driver != 'mysql'
    - r.stdout.find(bacula_credentials.db_name) == -1

- name: Create MySQL user
  mysql_user:
    user: "{{ bacula_credentials.db_user }}"
    password: "{{ bacula_credentials.db_password }}"
    host: "{{ bacula_credentials.db_hostname}}"
    priv: "{{ bacula_credentials.db_name }}.*:ALL"
  when: bacula_driver == 'mysql'
  # ApisCP limits max_join_size to 5M records to thwart monopolization from bad queries.
  # Bacula can easily grow beyond this in normal operation.
- name: Bump max_join_size
  ini_file:
    path: /etc/my.cnf.d/bacula.cnf
    section: mysqld
    option: "max_join_size"
    value: "{{ 2**64-1 }}"
  notify: Restart mariadb
  when: bacula_driver == 'mysql'

- name: Create PostgreSQL user
  postgresql_user:
    name: "{{ bacula_credentials.db_user }}"
    password: "{{ bacula_credentials.db_password }}"
    db: "{{ bacula_credentials.db_name }}"
  become: yes
  become_user: postgres
  when: bacula_driver == 'postgresql'
- name: Populate schema
  # Call make_<driver>_tables directly (not the make_bacula_tables wrapper):
  # both honor the db_name environment variable, and running as the postgres
  # user keeps the environment intact (the wrapper's `su - postgres` would drop
  # it). Creates the current 15.x schema (VersionId 1026) directly; do not
  # overwrite it with the old Bacula 9-era schema.
  command: "/usr/libexec/bacula/make_{{ bacula_driver }}_tables"
  environment:
    db_name: "{{ bacula_credentials.db_name }}"
  become: "{{ bacula_driver == 'postgresql' }}"
  become_user: postgres
  when:
    - r.stdout.find(bacula_credentials.db_name) == -1
  notify:
    - Restart bacula storage
- name: Grant PostgreSQL catalog privileges to {{ bacula_credentials.db_user }}
  # The catalog tables are created by the postgres superuser, so the bacula
  # role needs explicit privileges on tables and sequences (serials).
  postgresql_privs:
    db: "{{ bacula_credentials.db_name }}"
    role: "{{ bacula_credentials.db_user }}"
    privs: ALL
    type: "{{ item }}"
    objs: ALL_IN_SCHEMA
    schema: public
  loop:
    - table
    - sequence
  become: yes
  become_user: postgres
  when: bacula_driver == 'postgresql'
- name: Update schema tables
  # update_mysql_tables/update_postgresql_tables hardcode db_name=bacula and
  # ignore the db_name environment variable, so migrations only support the
  # default catalog name. A fresh catalog is already current (see above).
  command: "/usr/libexec/bacula/update_{{ bacula_driver }}_tables"
  environment:
    db_name: "{{ bacula_credentials.db_name }}"
  become: "{{ bacula_driver == 'postgresql' }}"
  become_user: postgres
  register: r
  failed_when:
    - r.rc != 0
    - r.stdout.find("existing database is version") == -1
  changed_when:
    - r.rc == 0
  when: bacula_credentials.db_name == 'bacula'
